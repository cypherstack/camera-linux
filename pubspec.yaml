name: camera_linux
description: Capture JPEG frames from a V4L2 webcam on Linux through dart:ffi, with no native dependencies.
version: 0.1.0
homepage: https://github.com/cypherstack/camera-linux

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ^1.1.0
  ffi: ^2.1.0
  hooks: ^2.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.0

dev_dependencies:
  image: ^4.3.0
  lints: ^6.0.0
  test: ^1.25.0
